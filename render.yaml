services:
  - type: web
    name: proofstack-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: RUN_MODE
        value: deterministic
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./proofstack.db
      - key: FRONTEND_URL
        value: https://proofstack-ashen-eta.vercel.app
