version: "3.8"

services:
  proofstack-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proofstack-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ProofStack — AI Career Coach
      - APP_VERSION=4.0.0
      - RUN_MODE=deterministic
      - PUBLIC_BASE_URL=http://localhost:8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/proofstack.db
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-dev_webhook_secret_key_proofstack}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - proofstack_data:/app/data
    restart: unless-stopped

volumes:
  proofstack_data:
